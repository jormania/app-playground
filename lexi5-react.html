<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lexi5</title>
  <meta name="description" content="A daily 5-letter word challenge." />
  <meta name="theme-color" content="#538d4e" />
  <script>
    // Apply the saved (or OS-preferred) theme before first paint.
    try {
      var cfg = JSON.parse(localStorage.getItem('lexi5_config') || 'null');
      var theme = cfg && cfg.theme;
      var dark = theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
  <link rel="icon" type="image/svg+xml" href="/lexi5-logo.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/lexi5-favicon-32.png" />
  <link rel="apple-touch-icon" href="/lexi5-icon-192.png" />
  <link rel="manifest" href="/lexi5.webmanifest" />
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/lexi5/main.jsx"></script>
</body>
</html>
