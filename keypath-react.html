<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>KeyPath</title>
  <meta name="description" content="Piano practice with a Yamaha keyboard over USB MIDI." />
  <!-- Unlisted: not in the apps registry, and search engines are asked to leave it alone. -->
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%B9%3C/text%3E%3C/svg%3E" />
  <!-- A manifest only to pin the scope, not to enable offline use (there is still no service
       worker, see KEYPATH_TUTOR.md §10). Without one, installing this page from Chrome's menu
       made a WebAPK scoped to the whole origin, which then caught every other app's links. -->
  <link rel="manifest" href="/keypath.webmanifest" />
  <link rel="apple-touch-icon" href="/keypath-icon-192.png" />
  <script>
    try {
      document.documentElement.setAttribute('data-theme', window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/keypath/main.tsx"></script>
</body>
</html>
