<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Law of the Day — 48 Laws of Power</title>
  <meta name="description" content="A daily multiple-choice quiz inspired by Robert Greene's The 48 Laws of Power. One scenario a day — guess the law, then see if you were right." />
  <meta name="theme-color" content="#fdf8ec" />
  <script>
    // Theme, applied before first paint to avoid a flash. Shared with the app
    // through one localStorage key: 'system' (the default) follows the OS, and
    // an explicit 'light'/'dark' overrides it.
    try {
      var p = localStorage.getItem('lawofday:theme');
      if (p !== 'light' && p !== 'dark') p = 'system';
      var dark = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', dark ? '#12141c' : '#fdf8ec');
    } catch (e) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="/law-of-the-day-logo.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/law-of-the-day-favicon-32.png" />
  <link rel="apple-touch-icon" href="/law-of-the-day-icon-192.png" />
  <link rel="manifest" href="/law-of-the-day.webmanifest" />
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/law-of-the-day/main.jsx"></script>
</body>
</html>
