<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Radar-B — radar cultural București</title>
  <meta name="description" content="Ce merită văzut în București, adunat din mai multe surse într-un singur flux. Descoperă, evaluează, salvează în Wanderlist." />
  <meta name="theme-color" content="#f3efe7" />
  <script>
    // Apply the saved theme before first paint to avoid a flash of the wrong palette.
    try {
      var p = JSON.parse(localStorage.getItem('radarb_prefs') || '{}');
      if (p.theme === 'dark' || p.theme === 'light') {
        document.documentElement.setAttribute('data-theme', p.theme);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', p.theme === 'dark' ? '#16161a' : '#f3efe7');
      }
    } catch (e) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="/radar-b-logo.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/radar-b-favicon-32.png" />
  <link rel="apple-touch-icon" href="/radar-b-icon-192.png" />
  <link rel="manifest" href="/radar-b.webmanifest" />
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/radar-b/main.jsx"></script>
</body>
</html>
