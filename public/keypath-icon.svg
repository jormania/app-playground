<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- KeyPath launcher tile: an octave of keys on the app's cream ground. Full-bleed,
       with the keys inside the central 80% so the same art serves as the maskable icon. -->
  <rect width="512" height="512" fill="#efe9dc"/>
  <g transform="translate(96 136)">
    <rect width="320" height="240" rx="18" fill="#fbf7ee" stroke="#3f4f58" stroke-width="10"/>
    <g stroke="#3f4f58" stroke-width="8">
      <line x1="64" y1="0" x2="64" y2="240"/>
      <line x1="128" y1="0" x2="128" y2="240"/>
      <line x1="192" y1="0" x2="192" y2="240"/>
      <line x1="256" y1="0" x2="256" y2="240"/>
    </g>
    <g fill="#3f4f58">
      <rect x="44" y="0" width="40" height="140" rx="6"/>
      <rect x="108" y="0" width="40" height="140" rx="6"/>
      <rect x="236" y="0" width="40" height="140" rx="6"/>
    </g>
  </g>
</svg>
