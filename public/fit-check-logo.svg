<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Fit Check">
  <title>Fit Check</title>
  <!--
    The mark alone, on transparent — the in-page favicon, where a dark tile would
    fight every browser theme. Same sparkle geometry as fit-check-icon.svg, minus
    the field and the seigaiha.

    Two deliberate differences from the tile, both because this is seen at 32px
    against UNKNOWN chrome rather than at 512px on a dark field:
      · The gradient never goes near-white. The tile's pale tip reads as a
        highlight against near-black; on a light toolbar the same stop made the
        top of the star disappear.
      · The star is a little wider at the waist (42 vs the tile's 32). The
        needle-thin silhouette turns into an anti-aliased smudge once it's 27px
        tall, so it's thickened just enough to survive — not enough to lose
        Nora's shape.
  -->
  <defs>
    <linearGradient id="fcLogoSpark" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#e88ad9"/>
      <stop offset="0.5" stop-color="#c556ac"/>
      <stop offset="1" stop-color="#8c2a7c"/>
    </linearGradient>
    <path id="fcLogoStar" d="M0-100Q0 0 42 0Q0 0 0 100Q0 0-42 0Q0 0 0-100Z"/>
  </defs>

  <g fill="url(#fcLogoSpark)">
    <use href="#fcLogoStar" transform="translate(248 264) scale(2.1)"/>
    <use href="#fcLogoStar" transform="translate(398 128) scale(0.66)"/>
    <use href="#fcLogoStar" transform="translate(112 148) scale(0.38)"/>
  </g>
</svg>
