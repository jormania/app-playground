<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- KeyPath favicon: the launcher tile with rounded corners, so it reads on light and dark tab bars alike. -->
  <rect width="512" height="512" rx="112" fill="#1f2347"/>
  <!-- A five-key keyboard, C to G (black keys where C–D, D–E and F–G meet),
       and a dotted path climbing from middle C to a star: the path in KeyPath.
       Everything sits inside the maskable safe zone (a circle of radius 205
       about the centre), so Android's round and squircle crops keep it whole. -->
  <g fill="#fbfaf7">
    <rect x="128.0" y="290" width="46.4" height="110" rx="7"/>
    <rect x="180.4" y="290" width="46.4" height="110" rx="7"/>
    <rect x="232.8" y="290" width="46.4" height="110" rx="7"/>
    <rect x="285.2" y="290" width="46.4" height="110" rx="7"/>
    <rect x="337.6" y="290" width="46.4" height="110" rx="7"/>
  </g>
  <g fill="#1f2347">
    <rect x="163.4" y="290" width="28" height="64" rx="5"/>
    <rect x="215.8" y="290" width="28" height="64" rx="5"/>
    <rect x="320.6" y="290" width="28" height="64" rx="5"/>
  </g>
  <path d="M 151.2 270 C 151.2 214, 214 222, 222 180 S 300 150, 300 128" fill="none" stroke="#e0795b" stroke-width="15" stroke-linecap="round" stroke-dasharray="1 27"/>
  <polygon points="310.0,70.0 318.8,93.9 344.2,94.9 324.3,110.6 331.2,135.1 310.0,121.0 288.8,135.1 295.7,110.6 275.8,94.9 301.2,93.9" fill="#f2c14e"/>
</svg>
