<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Codex Alchymicus - Index</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap');
    :root {
      --bg-dark: #120e0b;
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --gold-dark: #aa7c11;
      --parchment: #e8dcc7;
      --ink: #2b221a;
      --danger: #7a201b;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, #1a1511 0%, #0a0705 100%);
      font-family: 'IM Fell English', serif;
      color: var(--parchment);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .container {
      text-align: center;
      max-width: 600px;
      padding: 2rem;
      z-index: 10;
    }
    h1 {
      font-size: 3rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
      color: var(--gold-light);
      text-shadow: 0 2px 10px rgba(212, 175, 55, 0.2);
    }
    p {
      font-size: 1.2rem;
      font-style: italic;
      color: rgba(232, 220, 199, 0.7);
      margin-bottom: 3rem;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .option-card {
      background: linear-gradient(135deg, rgba(30, 24, 20, 0.9), rgba(15, 12, 10, 0.9));
      border: 1px solid rgba(212, 175, 55, 0.2);
      padding: 2rem;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      color: var(--gold-light);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .option-card:hover {
      border-color: rgba(212, 175, 55, 0.6);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.15);
    }
    .option-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)" opacity="0.05"/></svg>');
      pointer-events: none;
    }
    .option-title {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    .option-desc {
      font-size: 1rem;
      font-style: italic;
      color: rgba(232, 220, 199, 0.5);
    }
    
    /* KCD1 specific hover tint */
    .option-card.kcd1:hover {
      border-color: rgba(200, 50, 30, 0.6);
      box-shadow: 0 4px 20px rgba(200, 50, 30, 0.15);
    }
    
    /* SVG background decoration */
    .bg-deco {
      position: absolute;
      width: 400px;
      height: 400px;
      opacity: 0.03;
      pointer-events: none;
    }
    .bg-deco.left { top: 10%; left: -100px; }
    .bg-deco.right { bottom: 10%; right: -100px; }
  </style>
</head>
<body>
  
  <svg class="bg-deco left" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="45" fill="none" stroke="#fff" stroke-width="1"/>
    <path d="M50 5 L50 95 M5 50 L95 50" stroke="#fff" stroke-width="0.5"/>
  </svg>
  
  <svg class="bg-deco right" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="45" fill="none" stroke="#fff" stroke-width="1"/>
    <path d="M18 18 L82 82 M18 82 L82 18" stroke="#fff" stroke-width="0.5"/>
  </svg>

  <div class="container">
    <h1>Codex Alchymicus</h1>
    <p>Which compendium do you seek?</p>
    
    <div class="options">
      <a href="kcd1-codex.html" class="option-card kcd1">
        <div class="option-title">Deliverance I</div>
        <div class="option-desc">The original alchemy of Bohemia. Potions and poisons.</div>
      </a>
      
      <a href="kcd2-codex.html" class="option-card kcd2">
        <div class="option-title">Deliverance II</div>
        <div class="option-desc">The expanded compendium. Powders, perfumes, and more.</div>
      </a>
    </div>
  </div>
</body>
</html>
