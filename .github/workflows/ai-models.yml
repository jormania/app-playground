name: AI models (live)

# Sends every app's real Claude request once and fails on any the API rejects
# (scripts/anthropic.live.test.js). The unit tests fake fetch, so this is the
# only check that sees a model upgrade break a request. See AI_MODELS.md.
#
# It spends real money from the same key the apps use: about $0.05-0.10 for a
# full run (answers cut at 256 tokens, one search). In October 2026 it ran in
# full 44 times, on every pull-request push that touched a request file, and
# was likely a large part of a $5 month. So now it runs:
#   - once per change, when it lands on main, and only if the change touched a
#     file below — with only the requests of the apps that change touched
#     (scripts/live-check-needed.mjs sets LIVE_APPS; a shared file such as
#     models.js means every app). A broken request is reported minutes after
#     the deploy rather than before the merge: the trade for not re-running on
#     every push to a pull request;
#   - weekly, because a retired model shows up here before it shows up in an app
#     — and for that one tiny request per model is enough (LIVE_SCOPE=models:
#     two requests, not every app's);
#   - by hand (Actions -> AI models (live) -> Run workflow), every app.
# Needs the ANTHROPIC_API_KEY repository secret; without it the run fails on
# purpose, since a check that quietly skips is one nobody finds out is off.

# src/shared/models.test.js checks every file that calls Claude is listed here.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
  push:
    branches: [main]
    paths:
      - src/shared/models.js
      - src/shared/anthropic.ts
      - src/daily-stoic/lib/mentor.ts
      - src/lexi5/lib/curate.js
      - src/lexi5/components/Settings.jsx
      - src/law-of-the-day/lib/generate.js
      - src/long-listen/curator/curator.js
      - src/long-listen/curator/prompts.js
      - src/keypath/app/ai.ts
      - src/keypath/app/songs/coach.ts
      - src/keypath/app/progress/weekly.ts
      - src/keypath/app/studio/answer.ts
      - src/silva/lib/ocr.ts
      - src/silva/lib/tension.ts
      - src/fit-check/lib/tagging.ts
      - src/where-it-went/lib/aiParser.js
      - src/sol-odyssey/lib/companion.ts
      - src/touch-grass/engine.js
      - src/touch-grass/DeparturePanel.jsx
      - scripts/anthropic.live.test.js
      - scripts/live-check-needed.mjs
      - vitest.live.config.js
      - .github/workflows/ai-models.yml

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # A push to main runs only the requests of the apps it changed.
      - name: Which apps did this push change?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT" = push ]; then
            node scripts/live-check-needed.mjs "$BEFORE" "$AFTER" >> "$GITHUB_OUTPUT"
          else
            { echo "needed=true"; echo "apps=all"; } >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.needed == 'true'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.needed == 'true'
      - name: Live API check
        if: steps.gate.outputs.needed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIVE_SCOPE: ${{ github.event_name == 'schedule' && 'models' || 'all' }}
          LIVE_APPS: ${{ steps.gate.outputs.apps }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set — see AI_MODELS.md"
            exit 1
          fi
          npm run test:live
