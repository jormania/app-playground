name: Daily refactor

# One improvement per weekday morning, landing as its own PR off main.
# The procedure lives in .claude/skills/daily-refactor/SKILL.md; the queue in
# REFACTOR_BACKLOG.md. This workflow only supplies a scheduled runner that
# already has the repo and push rights — everything else is in those two files.

on:
  schedule:
    # GitHub's scheduled queue is best-effort — it warns that crons near the top
    # of the hour are delayed under load, and a dropped run is silent. So: two
    # attempts at odd minutes, the second a backstop the `gate` job below lets
    # through only if the first never landed. Both finish well before 07:00 local.
    - cron: '41 0 * * 1-5'   # 00:41 UTC weekdays = 03:41 Bucharest (02:41 in winter)
    - cron: '41 2 * * 1-5'   # 02:41 UTC — backstop, usually skipped
  workflow_dispatch:         # and a Run workflow button, for testing

permissions:
  contents: write
  pull-requests: write
  actions: read              # the gate reads this workflow's own run history

concurrency:
  group: daily-refactor
  cancel-in-progress: false

jobs:
  # Was today's slice already done? The backstop cron exists for the morning the
  # first one is dropped, not as a retry: any earlier run today, whatever became
  # of it, means stand down. A run started by hand always goes ahead.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Started by hand — going ahead."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +%F)
          earlier=$(gh api \
            "repos/$GH_REPO/actions/workflows/daily-refactor.yml/runs?per_page=30" \
            --jq "[.workflow_runs[]
                   | select(.id != ${{ github.run_id }})
                   | select(.created_at | startswith(\"$today\"))]
                  | length" || echo "")
          # An API hiccup must not become a silent skip: unreadable means go ahead.
          case "$earlier" in ''|*[!0-9]*) earlier=0 ;; esac
          if [ "$earlier" -gt 0 ]; then
            echo "$earlier Daily refactor run(s) already went out today — standing down."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing has run yet today — going ahead."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  refactor:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history: the backlog asks for `git log` on files before deleting them

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.REFACTOR_PAT || secrets.GITHUB_TOKEN }}
          show_full_output: true
          claude_args: |
            --model claude-opus-5
            --max-turns 60
            --allowedTools Bash,Read,Edit,Write,Glob,Grep,TodoWrite
          prompt: |
            Run today's autonomous improvement pass over this repository.

            You are already inside a full clone of jormania/app-playground with
            dependencies installed and push rights. Do not clone anything, do not
            run npm ci again.

            Follow `.claude/skills/daily-refactor/SKILL.md` — it is the complete
            procedure and outranks anything you would otherwise default to. Skip
            its step 0 and step 1; the runner has already done both. Read
            `CLAUDE.md` and `.agents/AGENTS.md` too, and treat their rules as
            outranking the skill.

            In short: branch off `origin/main` as `claude/refactor-$(date +%F)`,
            take exactly ONE eligible item from `REFACTOR_BACKLOG.md` — skipping
            anything under `## Proposed` and anything already claimed by an open
            `claude/refactor-*` PR — implement it, get `npm test -- --run`,
            `npm run typecheck` and `npx eslint <changed paths>` all green,
            update the backlog in the same commit, push, and open a PR against
            `main` carrying `Backlog-Item:` and `Class:` lines in the body.

            Items carry a class. `refactor` and `modernise` are
            behaviour-preserving and you may both queue and ship them yourself.
            `qol` and `visual` change what Gabriel sees when he opens an app —
            you may only PROPOSE those, under `## Proposed`, and never work one
            until a human has moved it up into the main list.

            If today is FRIDAY, ship nothing: read the codebase against current
            standards, append up to five new backlog items each with a class, an
            `Impact:` line and a concrete file path, and open a backlog-only PR.

            Never push to `main` — it auto-deploys to Vercel. If you cannot get
            all three gates green, throw the branch away, mark the item blocked
            in the backlog with the reason, and open no PR.

            **Open the PR body with `@jormania` on its own first line.** That
            mention is how the report actually reaches him — it notifies under
            GitHub's default settings whatever his watch state is, which a
            bot-opened PR otherwise may not.

            **Before you finish**, write `/tmp/refactor-result.json` so the
            workflow knows what you did:
            `{"branch": "claude/refactor-...", "class": "refactor", "pr": 59,
            "outcome": "shipped"}` — `branch` and `pr` null if you opened none,
            `class` exactly as it appears on the PR's `Class:` line. Do not
            commit this file. A run that writes nothing is treated as a run
            that changed nothing, and nothing will be merged.

            `outcome` is one of: `shipped` (a PR exists), `nothing-eligible`
            (the backlog had nothing to do, or the queue was full — a quiet,
            correct outcome) or `blocked` (you tried and could not finish:
            gates would not go green, the push failed, an item turned out to be
            wrong on contact). Be honest with it; `blocked` is what makes the
            run tell him something went wrong.

            Your closing report is what reaches Gabriel. LEAD with the class and
            one sentence on what he'd notice — "nothing changes on screen" is a
            fine and preferred opening when it is true; never inflate an
            invisible change. Then what changed, what a reviewer should look at
            hardest, anything you deliberately left alone, and any new proposals
            one line each. End with the PR URL and that merging it is what
            deploys to production.

      # ---- Everything below runs after the agent's step has ended. ----
      # It cannot influence any of it, which is the point: a run that merges to
      # production on its own must not be the thing that decides it passed.

      - name: Publish the report to the run summary
        if: always()
        run: |
          f="${RUNNER_TEMP}/claude-execution-output.json"
          if [ -f "$f" ]; then
            jq -r '[.. | objects | select(.type=="result") | .result] | last // "The run produced no report."' \
              "$f" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
              || echo "The agent's output could not be parsed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No agent output — the run failed before Claude produced a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Parsing is deliberately total: a missing or malformed result file means
      # "nothing to merge", never a red run. The agent forgetting to write it
      # should cost a click, not a morning.
      - name: Read what the run claims it did
        id: result
        if: always()
        run: |
          f=/tmp/refactor-result.json
          branch=""; class=""; pr=""
          if [ -f "$f" ] && jq -e . "$f" >/dev/null 2>&1; then
            branch=$(jq -r '.branch // ""' "$f")
            class=$(jq -r '.class  // ""' "$f" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
            pr=$(jq -r '.pr | select(. != null) | tostring' "$f" 2>/dev/null || true)
          else
            echo "::notice::No usable result file; nothing will be merged."
            echo "_No result file: nothing was auto-merged. If a PR was opened it is waiting for you._" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          case "$branch" in
            claude/refactor-*) ;;
            "") ;;
            *) echo "::warning::Refusing to act on unexpected branch '$branch'."; branch=""; class=""; pr="" ;;
          esac
          case "$pr" in ''|*[!0-9]*) pr="" ;; esac
          { echo "branch=$branch"; echo "class=$class"; echo "pr=$pr"; } >> "$GITHUB_OUTPUT"

      # The nightmare case for an auto-merging workflow: the agent pushes
      # straight to main. It is forbidden in three places, so this should never
      # fire — which is exactly why it is worth asserting rather than assuming.
      - name: Assert nothing was pushed straight to main
        if: always()
        run: |
          git fetch origin main --quiet
          rogue=$(git log "${{ github.sha }}..origin/main" --format='%an|%s' 2>/dev/null | grep -i '^claude' || true)
          if [ -n "$rogue" ]; then
            echo "::error::Commits authored by the agent appeared on main during this run:"
            echo "$rogue"
            exit 1
          fi

      - name: Check out the pushed branch, clean
        if: steps.result.outputs.branch != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.result.outputs.branch }}
          path: verify
          fetch-depth: 1

      - name: Verify it independently
        id: verify
        if: steps.result.outputs.branch != ''
        working-directory: verify
        run: |
          npm ci
          npm test -- --run
          npm run typecheck
          npx eslint .
          echo "verified=true" >> "$GITHUB_OUTPUT"

      # With auto-merge on, a wrong PR number would merge something else
      # entirely. Confirm the PR is the one this run actually produced.
      - name: Confirm the PR is this run's
        id: identity
        if: steps.verify.outputs.verified == 'true' && steps.result.outputs.pr != ''
        run: |
          pr='${{ steps.result.outputs.pr }}'
          json=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")
          head_ref=$(echo "$json"  | jq -r '.head.ref')
          head_repo=$(echo "$json" | jq -r '.head.repo.full_name')
          base_ref=$(echo "$json"  | jq -r '.base.ref')
          state=$(echo "$json"     | jq -r '.state')
          ok=true
          [ "$head_ref"  = '${{ steps.result.outputs.branch }}' ] || { echo "::error::PR #$pr head is $head_ref, not this run's branch."; ok=false; }
          [ "$head_repo" = "$GITHUB_REPOSITORY" ] || { echo "::error::PR #$pr comes from $head_repo."; ok=false; }
          [ "$base_ref"  = "main" ] || { echo "::error::PR #$pr targets $base_ref, not main."; ok=false; }
          [ "$state"     = "open" ] || { echo "::error::PR #$pr is $state."; ok=false; }
          $ok || exit 1
          echo "confirmed=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.REFACTOR_PAT || secrets.GITHUB_TOKEN }}

      - name: Merge, if the class allows it
        if: steps.identity.outputs.confirmed == 'true'
        run: |
          pr='${{ steps.result.outputs.pr }}'
          class='${{ steps.result.outputs.class }}'
          case "$class" in
            refactor|modernise)
              if gh pr merge "$pr" --squash --delete-branch; then
                echo "**Merged #$pr** (\`$class\`) after an independent green run. This is live on Vercel." \
                  >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::Merging #$pr failed — it is still open."
                echo "_Verification passed but the merge did not go through; #$pr is waiting for you._" \
                  >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            *)
              echo "**#$pr is class \`$class\`** — not auto-merged. It changes what you see, so it is yours to review." \
                >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
        env:
          GH_TOKEN: ${{ secrets.REFACTOR_PAT || secrets.GITHUB_TOKEN }}

      # Last resort channel. GitHub emails on a FAILED workflow by default,
      # while a successful one is silent unless you have gone and changed a
      # setting — so a run that got stuck deliberately fails, to borrow the
      # notification that is already switched on. A run that correctly did
      # nothing stays quiet: crying wolf on quiet days is how a person learns
      # to ignore the alert that matters.
      - name: Fail loudly if the run got stuck
        if: always()
        run: |
          f=/tmp/refactor-result.json
          outcome=""
          [ -f "$f" ] && outcome=$(jq -r '.outcome // ""' "$f" 2>/dev/null || true)
          if [ "$outcome" = "blocked" ]; then
            echo "::error::The run could not finish its item. See the report above."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**This run is marked failed on purpose** — it was blocked, and a failed run is the one GitHub emails you about by default." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Outcome: ${outcome:-unrecorded}"
