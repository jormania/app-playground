name: Daily refactor

# One improvement per weekday morning, landing as its own PR off main.
# The procedure lives in .claude/skills/daily-refactor/SKILL.md; the queue in
# REFACTOR_BACKLOG.md. This workflow only supplies a scheduled runner that
# already has the repo and push rights — everything else is in those two files.

on:
  schedule:
    # GitHub's scheduled queue is best-effort in two separate ways, and both have
    # already bitten. It warns that crons near the top of the hour are delayed
    # under load and that queued jobs may be dropped outright — so, odd minutes,
    # and two attempts. But a run can also simply sit: 2026-09-16's fired four
    # and a half hours late and landed at 08:13 Bucharest, long after the PR was
    # wanted. The cure for that is not another attempt, it is a bigger cushion.
    #
    # So the first attempt now fires the evening before. 22:41 UTC is the
    # EARLIEST hour that is already tomorrow in Bucharest in both seasons
    # (21:41 + 2h is still the same day under EET) — hence 22:41 and day-of-week
    # 0-4, which is Monday-to-Friday mornings local. That leaves 5h19m of slack
    # in summer and 6h19m in winter before 07:00, against 3h19m before.
    - cron: '41 22 * * 0-4'  # 22:41 UTC = 01:41 Bucharest next day (00:41 in winter)
    - cron: '41 0 * * 1-5'   # 00:41 UTC = 03:41 Bucharest — backstop, usually skipped
  workflow_dispatch:         # and a Run workflow button, for testing

permissions:
  contents: write
  pull-requests: write
  actions: read              # the gate reads this workflow's own run history

concurrency:
  group: daily-refactor
  cancel-in-progress: false

jobs:
  # Was today's slice already DONE — not merely attempted? The backstop stands
  # down for a run that succeeded or is still going, and proceeds otherwise.
  #
  # It used to count runs rather than outcomes, and 2026-09-22 showed the cost:
  # the 01:10 run died on an API 529 four minutes in, having produced nothing,
  # and the 05:21 backstop stood down because "1 run already went out today".
  # The backstop exists for exactly that morning and declined to work on it.
  #
  # The old rule was written for `blocked` — the agent tried, could not finish,
  # said so, and a retry would waste a slice. That is still true, and a blocked
  # run now gets one retry it does not deserve. That is the price: some tokens
  # and a second red run, against a guaranteed lost morning every time the API
  # hiccups at 01:10. Transient failures are common; blocked ones are rare.
  #
  # A run started by hand always goes ahead.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        # Deliberately no `set -e`. Every path through here ends in a decision:
        # the one thing this step must never do is die and leave the morning to
        # a default, which is the silence the whole arrangement exists to avoid.
        run: |
          set -uo pipefail
          decision=true
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Started by hand — going ahead."
          else
            # Bucharest dates, not UTC ones: the first cron fires the evening
            # before, so a run and its backstop sit on either side of UTC
            # midnight while belonging to the same morning here.
            today=$(TZ=Europe/Bucharest date +%F)
            # `success`, or not finished yet: a run still in flight counts, so a
            # delayed backstop queued behind the primary does not double up.
            # Anything else — failed, cancelled, timed out — leaves the morning
            # undone and is not a reason to stand down.
            earlier=$(gh api \
              "repos/$GH_REPO/actions/workflows/daily-refactor.yml/runs?per_page=30" \
              --jq ".workflow_runs[]
                    | select(.id != ${{ github.run_id }})
                    | select(.conclusion == \"success\" or .status != \"completed\")
                    | .created_at" \
              | while read -r ts; do TZ=Europe/Bucharest date -d "$ts" +%F; done \
              | grep -c "^$today$" || echo "")
            # Unreadable means go ahead. A duplicate run costs one slice of the
            # backlog; a wrongly skipped one costs the whole day and says nothing.
            case "${earlier:-}" in ''|*[!0-9]*) earlier=0 ;; esac
            if [ "$earlier" -gt 0 ]; then
              echo "$earlier Daily refactor run(s) already succeeded or are running today — standing down."
              decision=false
            else
              echo "Nothing has succeeded yet today — going ahead."
            fi
          fi
          echo "run=$decision" >> "$GITHUB_OUTPUT"

  refactor:
    needs: gate
    # Only an explicit `false` stops the morning. A gate that errored, timed out
    # or never produced an output must not quietly cancel the day's work — the
    # cost of getting this backwards is a duplicate PR, not a missing one.
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The first cron fires the evening before, so the runner's own date is
      # yesterday as far as Bucharest is concerned. Everything the agent names or
      # decides by date — the branch, and whether this is a Friday discovery run
      # — has to use the morning it is landing in, not `date` on the runner.
      - name: Work out which morning this is
        id: when
        run: |
          echo "date=$(TZ=Europe/Bucharest date +%F)" >> "$GITHUB_OUTPUT"
          echo "day=$(TZ=Europe/Bucharest date +%A)"  >> "$GITHUB_OUTPUT"
          echo "This run belongs to $(TZ=Europe/Bucharest date '+%A %F') in Bucharest."

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history: the backlog asks for `git log` on files before deleting them

      # Old refactor branches pile up. The workflow deletes its own on auto-merge,
      # but a `qol` or `visual` PR merged by hand leaves one behind, and so does a
      # closed PR. This runs BEFORE today's branch is cut, so this run's own work
      # can never be in scope — and it only removes a branch that HAS pull
      # requests and whose every one of them is closed. A branch with no PR is
      # left alone: that is a run that pushed and failed to open one, and its
      # commits are the only copy.
      - name: Prune merged refactor branches
        continue-on-error: true      # tidying must never cost a morning
        env:
          GH_TOKEN: ${{ secrets.REFACTOR_PAT || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          owner="${GH_REPO%%/*}"
          all=$(gh api "repos/$GH_REPO/branches?per_page=100" --jq '.[].name' 2>/dev/null) || {
            echo "Could not list branches — pruning nothing this run."
            exit 0
          }
          branches=$(printf '%s\n' "$all" | grep '^claude/refactor-' || true)
          if [ -z "$branches" ]; then
            echo "No claude/refactor-* branches on the remote."
            exit 0
          fi
          printf '%s\n' "$branches" | while read -r br; do
            # Counted, not inspected for state: "closed" is not good enough.
            # A PR closed WITHOUT merging means its commits never reached main,
            # and this branch is the only place they exist. Only a branch whose
            # every pull request was actually merged is safe to remove.
            counts=$(gh api "repos/$GH_REPO/pulls?state=all&head=$owner:$br" \
                       --jq '"\(length) \([.[] | select(.merged_at != null)] | length)"' \
                       2>/dev/null) || counts="ERR"
            # Whitelist, not blacklist: anything that is not literally two
            # numbers means we do not know, and not knowing means keep. An
            # earlier blacklist let an EMPTY answer through to the delete, which
            # is the one mistake this step cannot make twice.
            case "$counts" in
              [0-9]*' '[0-9]*) ;;
              *) echo "keep   $br — could not read its pull requests"; continue ;;
            esac
            total=${counts%% *}
            merged=${counts##* }
            if [ "$total" -eq 0 ]; then
              echo "keep   $br — no pull request, so this may be the only copy"
            elif [ "$total" -ne "$merged" ]; then
              echo "keep   $br — $((total - merged)) of its $total pull requests were not merged"
            elif gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$br" >/dev/null 2>&1; then
              echo "delete $br — all $total of its pull requests were merged"
            else
              echo "keep   $br — delete refused"
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.REFACTOR_PAT || secrets.GITHUB_TOKEN }}
          show_full_output: true
          # On --max-turns: 60 was too tight. On 2026-09-16 a run did the whole
          # item correctly — branch, three gates, screenshots, PR — and then
          # failed the job at 62 turns, because the action treats an overrun as
          # an error whatever the result was. A good run marked red is the same
          # disease as an empty run marked green: both teach you to stop reading
          # the signal. The real ceiling is timeout-minutes above — that run
          # spent 9m15s on 62 turns, so 150 lands near 22 minutes, inside 45.
          # Nothing here may be a comment: these lines are parsed as CLI args.
          claude_args: |
            --model claude-opus-5
            --max-turns 150
            --allowedTools Bash,Read,Edit,Write,Glob,Grep,TodoWrite
          prompt: |
            Run today's autonomous improvement pass over this repository.

            You are already inside a full clone of jormania/app-playground with
            dependencies installed and push rights. Do not clone anything, do not
            run npm ci again.

            Follow `.claude/skills/daily-refactor/SKILL.md` — it is the complete
            procedure and outranks anything you would otherwise default to. Skip
            its step 0 and step 1; the runner has already done both. Read
            `CLAUDE.md` and `.agents/AGENTS.md` too, and treat their rules as
            outranking the skill.

            **Today, for every purpose, is ${{ steps.when.outputs.day }}
            ${{ steps.when.outputs.date }} — that is the morning in Bucharest
            this run lands in.** The runner's own clock may still read
            yesterday, because the schedule fires the evening before. Use the
            date above for the branch name, the backlog's `done` stamp, any
            screenshot directory, and the Friday question. Never `date +%F`.

            In short: branch off `origin/main` as
            `claude/refactor-${{ steps.when.outputs.date }}`,
            take exactly ONE eligible item from `REFACTOR_BACKLOG.md` — skipping
            anything under `## Proposed` and anything already claimed by an open
            `claude/refactor-*` PR — implement it, get `npm test -- --run`,
            `npm run typecheck` and `npx eslint <changed paths>` all green,
            update the backlog in the same commit, push, and open a PR against
            `main` carrying `Backlog-Item:` and `Class:` lines in the body.

            Items carry a class. `refactor` and `modernise` are
            behaviour-preserving and you may both queue and ship them yourself.
            `qol` and `visual` change what Gabriel sees when he opens an app —
            you may only PROPOSE those, under `## Proposed`, and never work one
            until a human has moved it up into the main list.

            If today — ${{ steps.when.outputs.day }} — is FRIDAY, ship nothing:
            read the codebase against current
            standards, append up to five new backlog items each with a class, an
            `Impact:` line and a concrete file path, and open a backlog-only PR.

            Never push to `main` — it auto-deploys to Vercel. If you cannot get
            all three gates green, throw the branch away, mark the item blocked
            in the backlog with the reason, and open no PR.

            **Open the PR body with `@jormania` on its own first line.** That
            mention is how the report actually reaches him — it notifies under
            GitHub's default settings whatever his watch state is, which a
            bot-opened PR otherwise may not.

            **Before you finish**, write `/tmp/refactor-result.json` so the
            workflow knows what you did:
            `{"branch": "claude/refactor-${{ steps.when.outputs.date }}",
            "class": "refactor", "pr": 59, "outcome": "shipped"}` — `branch` and
            `pr` null if you opened none,
            `class` exactly as it appears on the PR's `Class:` line. Do not
            commit this file. A run that writes nothing is treated as a run
            that changed nothing, and nothing will be merged.

            `outcome` is one of: `shipped` (a PR exists), `nothing-eligible`
            (the backlog had nothing to do, or the queue was full — a quiet,
            correct outcome) or `blocked` (you tried and could not finish:
            gates would not go green, the push failed, an item turned out to be
            wrong on contact). Be honest with it; `blocked` is what makes the
            run tell him something went wrong.

            Your closing report is what reaches Gabriel. LEAD with the class and
            one sentence on what he'd notice — "nothing changes on screen" is a
            fine and preferred opening when it is true; never inflate an
            invisible change. Then what changed, what a reviewer should look at
            hardest, anything you deliberately left alone, and any new proposals
            one line each. End with the PR URL and that merging it is what
            deploys to production.

      # ---- Everything below runs after the agent's step has ended. ----
      # It cannot influence any of it, which is the point: a run that merges to
      # production on its own must not be the thing that decides it passed.

      - name: Publish the report to the run summary
        if: always()
        run: |
          f="${RUNNER_TEMP}/claude-execution-output.json"
          if [ -f "$f" ]; then
            jq -r '[.. | objects | select(.type=="result") | .result] | last // "The run produced no report."' \
              "$f" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
              || echo "The agent's output could not be parsed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No agent output — the run failed before Claude produced a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Parsing is deliberately total: a missing or malformed result file means
      # "nothing to merge", never a red run. The agent forgetting to write it
      # should cost a click, not a morning.
      - name: Read what the run claims it did
        id: result
        if: always()
        run: |
          f=/tmp/refactor-result.json
          branch=""; class=""; pr=""
          if [ -f "$f" ] && jq -e . "$f" >/dev/null 2>&1; then
            branch=$(jq -r '.branch // ""' "$f")
            class=$(jq -r '.class  // ""' "$f" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
            pr=$(jq -r '.pr | select(. != null) | tostring' "$f" 2>/dev/null || true)
          else
            echo "::notice::No usable result file; nothing will be merged."
            echo "_No result file: nothing was auto-merged. If a PR was opened it is waiting for you._" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          case "$branch" in
            claude/refactor-*) ;;
            "") ;;
            *) echo "::warning::Refusing to act on unexpected branch '$branch'."; branch=""; class=""; pr="" ;;
          esac
          case "$pr" in ''|*[!0-9]*) pr="" ;; esac
          { echo "branch=$branch"; echo "class=$class"; echo "pr=$pr"; } >> "$GITHUB_OUTPUT"

      # The nightmare case for an auto-merging workflow: the agent pushes
      # straight to main. It is forbidden in three places, so this should never
      # fire — which is exactly why it is worth asserting rather than assuming.
      - name: Assert nothing was pushed straight to main
        if: always()
        run: |
          git fetch origin main --quiet
          rogue=$(git log "${{ github.sha }}..origin/main" --format='%an|%s' 2>/dev/null | grep -i '^claude' || true)
          if [ -n "$rogue" ]; then
            echo "::error::Commits authored by the agent appeared on main during this run:"
            echo "$rogue"
            exit 1
          fi

      - name: Check out the pushed branch, clean
        if: steps.result.outputs.branch != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.result.outputs.branch }}
          path: verify
          fetch-depth: 1

      - name: Verify it independently
        id: verify
        if: steps.result.outputs.branch != ''
        working-directory: verify
        run: |
          npm ci
          npm test -- --run
          npm run typecheck
          npx eslint .
          echo "verified=true" >> "$GITHUB_OUTPUT"

      # With auto-merge on, a wrong PR number would merge something else
      # entirely. Confirm the PR is the one this run actually produced.
      - name: Confirm the PR is this run's
        id: identity
        if: steps.verify.outputs.verified == 'true' && steps.result.outputs.pr != ''
        run: |
          pr='${{ steps.result.outputs.pr }}'
          json=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")
          head_ref=$(echo "$json"  | jq -r '.head.ref')
          head_repo=$(echo "$json" | jq -r '.head.repo.full_name')
          base_ref=$(echo "$json"  | jq -r '.base.ref')
          state=$(echo "$json"     | jq -r '.state')
          ok=true
          [ "$head_ref"  = '${{ steps.result.outputs.branch }}' ] || { echo "::error::PR #$pr head is $head_ref, not this run's branch."; ok=false; }
          [ "$head_repo" = "$GITHUB_REPOSITORY" ] || { echo "::error::PR #$pr comes from $head_repo."; ok=false; }
          [ "$base_ref"  = "main" ] || { echo "::error::PR #$pr targets $base_ref, not main."; ok=false; }
          [ "$state"     = "open" ] || { echo "::error::PR #$pr is $state."; ok=false; }
          $ok || exit 1
          echo "confirmed=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.REFACTOR_PAT || secrets.GITHUB_TOKEN }}

      - name: Merge, if the class allows it
        if: steps.identity.outputs.confirmed == 'true'
        run: |
          pr='${{ steps.result.outputs.pr }}'
          class='${{ steps.result.outputs.class }}'
          case "$class" in
            refactor|modernise)
              if gh pr merge "$pr" --squash --delete-branch; then
                echo "**Merged #$pr** (\`$class\`) after an independent green run. This is live on Vercel." \
                  >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::Merging #$pr failed — it is still open."
                echo "_Verification passed but the merge did not go through; #$pr is waiting for you._" \
                  >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            *)
              echo "**#$pr is class \`$class\`** — not auto-merged. It changes what you see, so it is yours to review." \
                >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
        env:
          GH_TOKEN: ${{ secrets.REFACTOR_PAT || secrets.GITHUB_TOKEN }}

      # Last resort channel. GitHub emails on a FAILED workflow by default,
      # while a successful one is silent unless you have gone and changed a
      # setting — so a run that got stuck deliberately fails, to borrow the
      # notification that is already switched on. A run that correctly did
      # nothing stays quiet: crying wolf on quiet days is how a person learns
      # to ignore the alert that matters.
      - name: Fail loudly if the run got stuck
        if: always()
        run: |
          f=/tmp/refactor-result.json
          outcome=""
          [ -f "$f" ] && outcome=$(jq -r '.outcome // ""' "$f" 2>/dev/null || true)
          note() {
            echo "::error::$1"
            {
              echo ""
              echo "**This run is marked failed on purpose** — $2"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          case "$outcome" in
            shipped|nothing-eligible)
              echo "Outcome: $outcome" ;;
            blocked)
              note "The run could not finish its item. See the report above." \
                   "it was blocked, and a failed run is the one GitHub emails you about by default." ;;
            *)
              # The skill writes this file on every path it can finish, so its
              # absence means the session stopped early — turn limit, crash,
              # timeout. Those ended green and empty twice before anyone noticed;
              # green and empty is the one outcome that must never be quiet.
              note "The run ended without recording an outcome — it stopped early." \
                   "the agent never reached the end of its procedure, so nothing can be trusted to have happened." ;;
          esac
