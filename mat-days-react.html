<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mat Days · Find your practice.</title>
  <meta name="description" content="Mat Days — a personal yoga companion. Find your practice by time, body and mood." />
  <meta name="application-name" content="Mat Days" />
  <meta name="apple-mobile-web-app-title" content="Mat Days" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f7f3ea" />
  <script>
    // Applies your light/dark choice (or the phone's) before first paint, so a
    // dark screen never flashes ivory. Kept in step with src/mat-days/app/theme.ts.
    try {
      var choice = JSON.parse(localStorage.getItem('stillflow:theme') || '"system"');
      var dark = choice === 'dark' || (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1b1d1a');
    } catch (e) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="/mat-days-logo.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/mat-days-favicon-32.png" />
  <link rel="apple-touch-icon" href="/mat-days-icon-192.png" />
  <link rel="manifest" href="/mat-days.webmanifest" />
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/mat-days/main.tsx"></script>
</body>
</html>
