<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>WhereItWent</title>
  <meta name="description" content="Minimal personal finance analytics on top of your Notion database." />
  <meta name="theme-color" content="#121212" />
  <script>
    // Apply the saved (or OS-preferred) theme before first paint, so a light-mode
    // device doesn't flash dark before App.jsx's own effect corrects it.
    try {
      var cfg = JSON.parse(localStorage.getItem('whereItWent_config') || 'null');
      var theme = cfg && cfg.theme;
      var dark = theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
  <link rel="icon" type="image/svg+xml" href="/where-it-went-icon.svg" />
  <link rel="apple-touch-icon" href="/where-it-went-icon-192.png" />
  <link rel="manifest" href="/where-it-went.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/where-it-went/main.jsx"></script>
</body>
</html>
