<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Long Listen</title>
  <meta name="description" content="A personal orchestral curator: three directions each week, a programme you choose, and a memory of everything you've heard." />
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f5efe3" />
  <script>
    // Paint the saved palette (and text size) before React loads, so a dark phone never
    // flashes paper. Keep in step with src/long-listen/app/theme.ts and app/settings.ts.
    try {
      var raw = localStorage.getItem('long-listen:theme');
      var choice = raw ? JSON.parse(raw) : 'system';
      var dark = choice === 'dark' || (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', dark ? '#16130f' : '#f5efe3');
      // The text size too, so "Larger" is the size of the first paint, not a jump once the app has loaded.
      var saved = JSON.parse(localStorage.getItem('long-listen:settings') || '{}');
      document.documentElement.setAttribute('data-text-size', saved && saved.textSize === 'large' ? 'large' : 'standard');
    } catch (e) {}
  </script>
  <style>
    /* The paper (or the dark) from the first paint, before the app's own styles arrive: a page
       reloaded while it was out of sight comes back on its own colour, never a white flash.
       Keep in step with --color-bg in src/long-listen/styles/palette.css. */
    /* :where() keeps these at no weight: the moment the app's styles load, palette.css's
       html { background: var(--color-bg) } wins — the listening view's darks (data-listening)
       included. With weight, this held the paper behind the listening view (29 October 2026). */
    :where(html[data-theme="light"]) { background: #f5efe3; }
    :where(html[data-theme="dark"]) { background: #16130f; }
  </style>
  <link rel="icon" type="image/svg+xml" href="/long-listen-logo.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/long-listen-favicon-32.png" />
  <link rel="apple-touch-icon" href="/long-listen-icon-192.png" />
  <link rel="manifest" href="/long-listen.webmanifest" />
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/long-listen/main.tsx"></script>
</body>
</html>
