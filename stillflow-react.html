<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Stillflow · Find your practice.</title>
  <meta name="description" content="Stillflow — a personal yoga companion. Find your practice by time, body and mood." />
  <meta name="application-name" content="Stillflow" />
  <meta name="apple-mobile-web-app-title" content="Stillflow" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f7f3ea" />
  <script>
    // Follows the OS before first paint, so a dark phone never flashes ivory.
    // Kept in step with src/stillflow/main.tsx.
    try {
      var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1b1d1a');
    } catch (e) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="/stillflow-logo.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/stillflow-favicon-32.png" />
  <link rel="apple-touch-icon" href="/stillflow-icon-192.png" />
  <link rel="manifest" href="/stillflow.webmanifest" />
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/stillflow/main.tsx"></script>
</body>
</html>
