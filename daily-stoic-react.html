<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Daily Stoic — wisdom and reflections</title>
  <meta name="description" content="A daily Stoic companion displaying public domain quotes and a journal for reflections." />
  <meta name="theme-color" content="#4B45C6" />
  <script>
    // Resolve the saved theme before first paint, so there's no flash of the
    // wrong palette. Mirrors src/daily-stoic/lib/theme.ts — keep in step.
    // "system" (the default) deliberately sets NO attribute: tokens.css's own
    // prefers-color-scheme block handles it and keeps following the OS.
    try {
      var LEGACY_DARK = ['indigo-dark', 'octagon', 'ristretto', 'spectrum'];
      var raw = localStorage.getItem('daily-stoic:theme');
      var pref = 'system';
      if (raw === 'light' || raw === 'dark' || raw === 'system') pref = raw;
      else if (raw) pref = LEGACY_DARK.indexOf(raw) !== -1 ? 'dark' : 'light';

      if (pref !== 'system') document.documentElement.setAttribute('data-theme', pref);

      var dark = pref === 'dark'
        || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', dark ? '#121127' : '#4B45C6');
    } catch (e) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="/daily-stoic-logo.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/daily-stoic-favicon-32.png" />
  <link rel="apple-touch-icon" href="/daily-stoic-icon-192.png" />
  <link rel="manifest" href="/daily-stoic.webmanifest" />
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/daily-stoic/main.tsx"></script>
</body>
</html>
