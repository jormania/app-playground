<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Silva</title>
  <meta name="description" content="A forest of things — a private commonplace book arranged by affinity, not filing." />
  <!-- Silva's own ground, light and dark — the herbarium's rag paper and its
       bark at night (src/silva/styles/palette.css). This was a leftover
       solarized blue, which painted the phone's browser chrome a colour that
       appears nowhere in the app. -->
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f2ecd9" />
  <script>
    // Applies the saved palette (light/dark/"follow the OS") before first
    // paint, so a dark-mode phone with "Daylight" chosen never flashes a
    // sheet of white, and an explicit choice isn't briefly overridden by
    // the two now-removed prefers-color-scheme <meta> entries above. Keep
    // in step with src/silva/lib/theme.ts, which reads the same key.
    try {
      var raw = localStorage.getItem('silva:theme');
      var choice = raw ? JSON.parse(raw) : null;
      var dark = choice === 'dark' || (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', dark ? '#241b12' : '#f2ecd9');
    } catch (e) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="/silva-logo.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/silva-favicon-32.png" />
  <link rel="apple-touch-icon" href="/silva-icon-192.png" />
  <link rel="manifest" href="/silva.webmanifest" />
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/silva/main.tsx"></script>
</body>
</html>
